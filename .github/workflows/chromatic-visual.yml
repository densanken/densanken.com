name: Chromatic Visual Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  chromatic-visual:
    name: Chromatic Visual Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      CHROMATIC_ARCHIVE_LOCATION: ./test-results/chromatic
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up sfw
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        # DO NOT cache pnpm
        # `sfw pnpm install` doesn't detect contaminated packages in the cache

      - name: Set up Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          # DO NOT cache pnpm
          # `sfw pnpm install` doesn't detect contaminated packages in the cache

      - name: Install dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright visual tests
        run: pnpm test:visual

      - name: Upload to Chromatic
        run: pnpm chromatic:playwright
