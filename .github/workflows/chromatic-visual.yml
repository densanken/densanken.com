name: Chromatic Visual Tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

jobs:
  chromatic-visual:
    name: Chromatic Visual Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      CHROMATIC_ARCHIVE_LOCATION: ./test-results/chromatic
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    if: >
      github.event_name == 'push' ||
      !contains(github.event.pull_request.labels.*.name, 'ci:skip-chromatic')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up sfw
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # DO NOT cache pnpm
        # `sfw pnpm install` doesn't detect contaminated packages in the cache

      - name: Set up Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # DO NOT cache pnpm
          # `sfw pnpm install` doesn't detect contaminated packages in the cache

      - name: Install dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright visual tests
        run: pnpm test:visual

      - name: Upload to Chromatic
        run: pnpm chromatic:playwright
